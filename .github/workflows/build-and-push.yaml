name: Build and Push Container Image

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    permissions: # needed for signing and attestations
     id-token: write # write seems weird, but it is correct per docs
     attestations: write
     contents: read
     packages: write

    runs-on: ubuntu-latest

    steps:
      - 
        name: Install Cosign
        uses: chainguard-actions/sigstore-cosign-installer@65ce94cb2e152e8e42826c8ad06386bf4074b6a3 # v4.1.2
      -
        name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@695a7c62d4fe3f2071dbd659ecd5a8f9bc96e4dd # v4.2.0
      -
        name: Login to GitHub Container Registry
        uses: chainguard-actions/docker-login-action@93c9fb113ac946f14a332842652ec9600e25babc # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: chainguard-actions/docker-metadata-action@cbbbf7eae1a30a9b5ea4c5acd6dc1f8403a808aa # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          labels: |
            org.opencontainers.image.description=Guardener Learning Lab Image
      -
        name: Build and push
        id: build
        uses: chainguard-actions/docker-build-push-action@1d730b19ab3e753ee93137291b02df125e88eb3c # v7.3.0
        with:
          file: Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      -
        name: Attest
        uses: chainguard-actions/actions-attest-build-provenance@773612c6bd10079477eb8429fee24df7fdb0bf1a # v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - 
        name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
